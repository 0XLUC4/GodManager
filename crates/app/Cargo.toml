[package]
name = "godmanager"
description = "GodManager: pure-Rust download manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "godmanager"
path = "src/main.rs"

[dependencies]
godmanager-core.workspace = true
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.35"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
egui-phosphor = "0.13"
serde_json.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }

[build-dependencies]
winresource = "0.1"
